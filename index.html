<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爱心图片合成工具</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 新增：二次元动态背景样式 */
        .anime-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url(https://xcimg.szwego.com/img/d3be270a/20260203/o_1jgh3bh881j431qmhcgn18ld15uh0.jpeg);
            background-size: cover;
            background-position: center;
            opacity: 0.25;
            filter: blur(1.5px);
            z-index: -1;
            animation: bgAnimate 20s infinite ease-in-out;
        }

        @keyframes bgAnimate {
            0% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(1.05) translate(-2px, -2px); }
            100% { transform: scale(1) translate(0, 0); }
        }
        
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            min-height: 100vh;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 25px;
            background: linear-gradient(135deg, #2c2c54, #474787);
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            border: 1px solid #575fcf;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #f7dc6f, #f1c40f);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 700;
        }
        
        .description {
            font-size: 1.1rem;
            max-width: 800px;
            margin: 0 auto;
            color: #d1d1d1;
        }
        
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
        
        .panel {
            background-color: rgba(30, 30, 30, 0.85);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid #444;
            backdrop-filter: blur(5px);
        }
        
        .panel h2 {
            margin-bottom: 20px;
            color: #f7dc6f;
            font-size: 1.6rem;
            border-bottom: 1px solid #555;
            padding-bottom: 10px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #e0e0e0;
        }
        
        input[type="file"], input[type="number"] {
            width: 100%;
            padding: 12px;
            background-color: #2a2a2a;
            border: 1px solid #555;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input[type="file"]:hover, input[type="number"]:hover {
            border-color: #f1c40f;
        }
        
        input[type="number"] {
            max-width: 150px;
        }
        
        .threshold-info {
            font-size: 0.9rem;
            color: #aaa;
            margin-top: 5px;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }
        
        button {
            flex: 1;
            padding: 14px 20px;
            background: linear-gradient(135deg, #e67e22, #d35400);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(230, 126, 34, 0.4);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(230, 126, 34, 0.5);
            background: linear-gradient(135deg, #d35400, #e67e22);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        #saveButton {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.4);
        }
        
        #saveButton:hover {
            box-shadow: 0 8px 18px rgba(39, 174, 96, 0.5);
            background: linear-gradient(135deg, #2ecc71, #27ae60);
        }
        
        #errorMessage {
            color: #e74c3c;
            margin: 15px 0;
            padding: 12px;
            background-color: rgba(231, 76, 60, 0.15);
            border-radius: 8px;
            border-left: 4px solid #e74c3c;
        }
        
        .success-message {
            color: #2ecc71;
            margin: 15px 0;
            padding: 12px;
            background-color: rgba(46, 204, 113, 0.15);
            border-radius: 8px;
            border-left: 4px solid #2ecc71;
        }
        
        .image-previews {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .preview-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #555;
            background-color: #2a2a2a;
            transition: transform 0.3s;
        }

        .preview-item:hover {
            transform: scale(1.03);
        }
        
        .preview-item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block;
        }
        
        .preview-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 5px;
            font-size: 0.8rem;
            text-align: center;
        }
        
        .result-container {
            text-align: center;
            margin-top: 20px;
        }
        
        #composedImage {
            max-width: 100%;
            margin: 0 auto;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            border: 1px solid #555;
        }
        
        #composedImage img {
            max-width: 100%;
            display: block;
            margin: 0 auto;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 4px solid #e67e22;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .info-box {
            background-color: rgba(44, 44, 84, 0.7);
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            border-left: 4px solid #f1c40f;
        }
        
        .info-box h3 {
            color: #f7dc6f;
            margin-bottom: 10px;
        }
        
        .info-box ul {
            padding-left: 20px;
        }
        
        .info-box li {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <!-- 新增：动态背景容器 -->
    <div class="anime-bg"></div>

    <header>
        <h1>图片合成工具</h1>
        <p class="description">上传拆分图片和原始背景图片，设置阈值，合成图片！</p>
    </header>
    
    <div class="container">
        <div class="panel">
            <h2>上传图片</h2>
            
            <div class="form-group">
                <label for="splitImages">上传拆分图片（多张）：</label>
                <input type="file" accept="image/*" id="splitImages" multiple>
                <div class="threshold-info">可以一次选择多张图片</div>
            </div>
            
            <div class="form-group">
                <label for="backgroundImage">上传原始背景图片（单张）：</label>
                <input type="file" accept="image/*" id="backgroundImage">
            </div>
            
            <div class="form-group">
                <label for="threshold">像素比较阈值：</label>
                <input type="number" id="threshold" value="30" min="1" max="255">
                <div class="threshold-info">数值越小，比较越严格（推荐值：10-50）</div>
            </div>
            
            <div class="button-group">
                <button onclick="composeImage()">一键合成图片</button>
                <button id="saveButton" onclick="saveComposedImage()" style="display: none;">保存合成图片</button>
            </div>
            
            <div id="errorMessage"></div>
            <div id="successMessage" class="success-message" style="display: none;"></div>
            
            <div class="loading" id="loadingIndicator">
                <div class="spinner"></div>
                <p>正在处理图片，请稍候...</p>
            </div>
            
            <div class="info-box">
                <h3>使用说明：</h3>
                <ul>
                    <li>交流群971040924</li>
                    <li>程序会自动将拆分图片适配到背景图片的尺寸</li>
                    <li>调整阈值可以控制识别的敏感度</li>
                    <li>如果合成效果不理想，尝试调整阈值重新合成</li>
                </ul>
            </div>
        </div>
        
        <div class="panel">
            <h2>预览与结果</h2>
            
            <div id="uploadedImages">
                <p>上传的图片将在这里显示</p>
            </div>
            
            <div id="composedImage" class="result-container">
                <p>合成后的图片将在这里显示</p>
            </div>
        </div>
    </div>

    <script>
        let composedCanvas; // 保存合成画布以便下载
        
        // 显示上传的图片预览
        function updateImagePreviews() {
            const splitFiles = document.getElementById('splitImages').files;
            const bgFile = document.getElementById('backgroundImage').files[0];
            const uploadedImagesContainer = document.getElementById('uploadedImages');
            
            uploadedImagesContainer.innerHTML = '';
            
            if (splitFiles.length === 0 && !bgFile) {
                uploadedImagesContainer.innerHTML = '<p>上传的图片将在这里显示</p>';
                return;
            }
            
            // 显示背景图片
            if (bgFile) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const previewItem = document.createElement('div');
                    previewItem.className = 'preview-item';
                    
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    
                    const label = document.createElement('div');
                    label.className = 'preview-label';
                    label.textContent = '背景图片';
                    
                    previewItem.appendChild(img);
                    previewItem.appendChild(label);
                    uploadedImagesContainer.appendChild(previewItem);
                };
                reader.readAsDataURL(bgFile);
            }
            
            // 显示拆分图片
            Array.from(splitFiles).forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const previewItem = document.createElement('div');
                    previewItem.className = 'preview-item';
                    
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    
                    const label = document.createElement('div');
                    label.className = 'preview-label';
                    label.textContent = `拆分图片 ${index + 1}`;
                    
                    previewItem.appendChild(img);
                    previewItem.appendChild(label);
                    uploadedImagesContainer.appendChild(previewItem);
                };
                reader.readAsDataURL(file);
            });
        }
        
        // 监听文件选择变化
        document.getElementById('splitImages').addEventListener('change', updateImagePreviews);
        document.getElementById('backgroundImage').addEventListener('change', updateImagePreviews);
        
        async function composeImage() {
            const splitFiles = document.getElementById('splitImages').files;
            const bgFile = document.getElementById('backgroundImage').files[0];
            const threshold = parseInt(document.getElementById('threshold').value) || 30;
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            const loadingIndicator = document.getElementById('loadingIndicator');
            
            // 隐藏消息
            errorMessage.textContent = '';
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            
            // 输入检查
            if (splitFiles.length === 0) {
                errorMessage.textContent = '请上传至少一张拆分图片！';
                errorMessage.style.display = 'block';
                return;
            }
            if (!bgFile) {
                errorMessage.textContent = '请上传原始背景图片！';
                errorMessage.style.display = 'block';
                return;
            }
            
            const composedImageContainer = document.getElementById('composedImage');
            composedImageContainer.innerHTML = '';
            
            // 显示加载指示器
            loadingIndicator.style.display = 'block';
            
            try {
                // 加载背景图片
                const bgImg = await loadImage(bgFile);
                
                // 创建背景画布
                const bgCanvas = document.createElement('canvas');
                bgCanvas.width = bgImg.width;
                bgCanvas.height = bgImg.height;
                const bgCtx = bgCanvas.getContext('2d');
                bgCtx.drawImage(bgImg, 0, 0);
                const bgData = bgCtx.getImageData(0, 0, bgCanvas.width, bgCanvas.height).data;
                
                // 加载所有拆分图片
                const splitImages = await Promise.all(
                    Array.from(splitFiles).map(file => loadImage(file))
                );
                
                // 创建合成画布
                composedCanvas = document.createElement('canvas');
                composedCanvas.width = bgCanvas.width;
                composedCanvas.height = bgCanvas.height;
                const composedCtx = composedCanvas.getContext('2d');
                
                // 首先绘制背景
                composedCtx.drawImage(bgImg, 0, 0);
                const composedImageData = composedCtx.getImageData(0, 0, composedCanvas.width, composedCanvas.height);
                const composedData = composedImageData.data;
                
                let hasHeartPixels = false; // 检查是否识别到爱心像素
                
                // 处理每张拆分图片
                for (const img of splitImages) {
                    // 创建临时画布处理不同尺寸的图片
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = bgCanvas.width;
                    tempCanvas.height = bgCanvas.height;
                    const tempCtx = tempCanvas.getContext('2d');
                    
                    // 将拆分图片绘制到与背景相同尺寸的画布上
                    // 自动适配不同尺寸的图片
                    tempCtx.drawImage(img, 0, 0, bgCanvas.width, bgCanvas.height);
                    const splitData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height).data;
                    
                    // 像素比较
                    for (let i = 0; i < splitData.length; i += 4) {
                        const rDiff = Math.abs(splitData[i] - bgData[i]);
                        const gDiff = Math.abs(splitData[i + 1] - bgData[i + 1]);
                        const bDiff = Math.abs(splitData[i + 2] - bgData[i + 2]);
                        
                        // 如果像素差异超过阈值，则使用拆分图片的像素
                        if (rDiff > threshold || gDiff > threshold || bDiff > threshold) {
                            composedData[i] = splitData[i];
                            composedData[i + 1] = splitData[i + 1];
                            composedData[i + 2] = splitData[i + 2];
                            composedData[i + 3] = 255;
                            hasHeartPixels = true;
                        }
                    }
                }
                
                // 检查是否识别到爱心
                if (!hasHeartPixels) {
                    errorMessage.textContent = '未检测到爱心形状！请尝试调整阈值或检查背景图片是否正确。';
                    errorMessage.style.display = 'block';
                    loadingIndicator.style.display = 'none';
                    return;
                }
                
                // 将合成数据放回画布
                composedCtx.putImageData(composedImageData, 0, 0);
                
                // 显示合成图片
                const composedImgElement = document.createElement('img');
                composedImgElement.src = composedCanvas.toDataURL();
                composedImgElement.alt = '合成后的图片';
                composedImageContainer.innerHTML = '<h3>合成结果：</h3>';
                composedImageContainer.appendChild(composedImgElement);
                
                // 显示保存按钮
                document.getElementById('saveButton').style.display = 'inline-block';
                
                // 显示成功消息
                successMessage.textContent = '图片合成成功！';
                successMessage.style.display = 'block';
                
            } catch (error) {
                errorMessage.textContent = `处理图片时出错：${error.message}`;
                errorMessage.style.display = 'block';
            } finally {
                // 隐藏加载指示器
                loadingIndicator.style.display = 'none';
            }
        }
        
        // 辅助函数：加载图片
        function loadImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }
        
        function saveComposedImage() {
            if (composedCanvas) {
                const link = document.createElement('a');
                link.download = '爱心合成图片.png';
                link.href = composedCanvas.toDataURL();
                link.click();
                
                // 显示下载成功消息
                const successMessage = document.getElementById('successMessage');
                successMessage.textContent = '图片已开始下载！';
                successMessage.style.display = 'block';
            }
        }
    </script>
</body>
</html>
